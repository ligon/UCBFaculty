[project]
name = "ucbfaculty"
# Version is derived from `git describe` at build time by
# poetry-dynamic-versioning (see [tool.poetry-dynamic-versioning]
# and [build-system] below).  With a PEP 621 [project] table the
# version MUST be declared dynamic here and the placeholder kept
# under [tool.poetry]; a literal `version = "0.0.0"` in [project]
# is authoritative and the plugin silently leaves it alone (that is
# how a 0.0.0 wheel reached PyPI in July 2026).
dynamic = ["version"]
description = "Faculty data for use by Berkeley's Academic Senate"
authors = [
    {name = "Ethan Ligon", email = "ligon@berkeley.edu"}
]
license = "AGPL-3.0-or-later"
readme = "README.org"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.2",
    "ligonlibrary>=0.1.6",
    "pyyaml>=6.0.2,<7.0.0",
    "python-dateutil>=2.9.0,<3.0.0",
    "Levenshtein>=0.27.3,<0.28.0",
    "panel>=1.4.4,<2.0.0",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pyarrow (>=23.0.0,<24.0.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "mcp (>=1.2.0,<2.0.0)",
    "thefuzz (>=0.22.1,<0.23.0)",
    "duckdb (>=1.1.0,<2.0.0)"
]

[project.scripts]
ucbfaculty = "ucbfaculty.cli:main"
ucbfaculty-mcp = "ucbfaculty.mcp_server:main"

[tool.setuptools.package-data]
ucbfaculty = ["spelling_dictionary.json"]

[tool.poetry]
# Placeholder only; replaced at build time (see the note on
# `dynamic` above).  Ships as-is only when built outside a git
# checkout.
version = "0.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pipreqs = {version = "^0.5.0", python = ">=3.11,<3.13"}
watchfiles = "^1.1.1"
pyinstaller = {version = ">=6.0,<7.0", python = ">=3.11,<3.14"}


[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.poetry-dynamic-versioning]
# Inject a git-derived PEP 440 version at build time, so every wheel
# carries its commit SHA in the local segment (e.g. 0.2.4.post20+gc839bfd).
# This makes "is my install up to date?" debugging visual rather than
# requiring a separate `git log` step.
enable = true
vcs = "git"
style = "pep440"

[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0",
    "poetry-dynamic-versioning>=1.4.0,<2.0.0",
]
build-backend = "poetry_dynamic_versioning.backend"
